pid /run/hslu-proxy.pid;
error_log /var/log/nginx/hslu-proxy-error.log;
events { worker_connections 256; }
http {
    access_log /var/log/nginx/hslu-proxy-access.log;
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;
        ssl_certificate     /etc/hslu-proxy/dashboard.crt;
        ssl_certificate_key /etc/hslu-proxy/dashboard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 5m;
        # noVNC auf den zoomrec-Bildschirm, nur nach Dashboard-Login (auth_request fragt Flask)
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:5000/api/auth_check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
        location /vnc/ {
            auth_request /_auth;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location @login {
            add_header WWW-Authenticate 'Basic realm="Login Required"' always;
            return 401;
        }
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }
}
