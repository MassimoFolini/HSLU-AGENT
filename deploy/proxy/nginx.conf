pid /run/hslu-proxy.pid;
error_log /var/log/nginx/hslu-proxy-error.log;
events { worker_connections 256; }
http {
    access_log /var/log/nginx/hslu-proxy-access.log;
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;
        ssl_certificate     /etc/hslu-proxy/dashboard.crt;
        ssl_certificate_key /etc/hslu-proxy/dashboard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 5m;
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }
}
